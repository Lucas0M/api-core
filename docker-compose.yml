services:
  app:
    build: .
    container_name: lumen_app
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: lumen
      DB_USERNAME: lumen
      DB_PASSWORD: lumen
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: lumen_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lumen
      MYSQL_USER: lumen
      MYSQL_PASSWORD: lumen
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
