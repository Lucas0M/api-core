services:
  app:
    build: .
    container_name: lumen_app
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: lumen_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lumen
      MYSQL_USER: lumen
      MYSQL_PASSWORD: lumen
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  vendor:
